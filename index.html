<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Particles</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="menu-container">
        <button id="menuBtn" class="menu-btn">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div id="sideMenu" class="side-menu">
            <ul>
                <li><a href="#" id="homeLink">Homepage</a></li>
                <li><a href="#" id="projectLink">Firework</a></li>
                <li><a href="#" id="pcStatusLink">PC Status</a></li>
            </ul>
        </div>
    </div>
    <canvas id="particleCanvas"></canvas>
    <div class="content" style="display: none;">
        <h1>Particle Universe</h1>
        <p>Interactive web experience</p>
    </div>

    <!-- PC Status Modal -->
    <div id="pcStatusModal" class="modal">
        <div class="modal-content system-info">
            <h2>PC Status</h2>
            <div class="status-grid">
                <div class="status-item">
                    <span class="label">OS</span>
                    <span class="value">macOS 26.5</span>
                </div>
                <div class="status-item">
                    <span class="label">CPU</span>
                    <span class="value">Apple M4 (10 Cores)</span>
                </div>
                <div class="status-item">
                    <span class="label">GPU</span>
                    <span class="value">Apple M4 10-core</span>
                </div>
                <div class="status-item">
                    <span class="label">Memory</span>
                    <span class="value">16 GB RAM</span>
                </div>
                <div class="status-item">
                    <span class="label">Storage</span>
                    <span class="value">460GB (149GB Free)</span>
                </div>
                <div class="status-item">
                    <span class="label">Display</span>
                    <span class="value">5120 x 2880 (5K)</span>
                </div>
            </div>
            <button id="closePCStatus" class="close-modal">&times;</button>
        </div>
    </div>
    <script src="mottos.js"></script>
    <script src="script.js"></script>
</body>

</html>
